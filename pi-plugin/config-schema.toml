version = 1

[defaults]
model = "gpt-5.5"
reasoning = "low"

[[packs]]
id = "core-workflow"
enabled = true
source = "../.agents/skills/core-workflow"
targets = ["pi", "codex"]

[[packs]]
id = "rtk-routing"
enabled = true
source = "../.agents/skills/rtk-routing"
targets = ["pi", "codex"]

[[packs]]
id = "agent-lanes"
enabled = true
source = "../.agents/skills/agent-lanes"
targets = ["pi", "codex"]

[[packs]]
id = "sane-router"
enabled = true
source = "../.agents/skills/sane-router"
targets = ["pi", "codex"]

[[user_packs]]
id = "example-user-pack"
enabled = false
source = "../.agents/skills/example-user-pack"
targets = ["pi", "codex"]

[[export_targets]]
id = "pi"
kind = "pi-skill"
path = ".pi/skills"

[[export_targets]]
id = "codex"
kind = "codex-skill"
path = ".codex/skills"

[ownership]
marker_file = ".sane-next-owned"
preserve_user_config = true
