# Sane-owned overlay manifest. Pi package discovery uses the generated package.json.
id = "sane-next"
name = "Sane Next"
version = "0.2.0"
description = "Pi-first overlay for Sane shared workflow packs and companion CLI integration."
entrypoint = "index.ts"

[runtime]
host = "pi"
minimum_version = "0.73.0"

[config]
schema = "config-schema.toml"

[[skills]]
id = "core-workflow"
source = "../.agents/skills/core-workflow"
compatibility = ["pi", "codex"]
