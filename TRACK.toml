version = 2
updated = "2026-05-08"
phase = "release-readiness-selection"
goal = "Choose the next bounded release-readiness slice after the docs/tracking reset."
next_focus = "Select one roadmap item to activate: distribution-channel ADR, pre-stable release checklist, or package pin refresh."

[tracking]
schema = "active-window-v1"
canonical_current_state = "TRACK.toml"
canonical_roadmap = "docs/roadmap/ROADMAP.md"
canonical_reference = "docs/reference/"
canonical_decision_history = "docs/adr/"
canonical_standards = "docs/standards/"
progress_evidence = "git commits and pull requests"
rules = [
  "Keep only active-window state here.",
  "Do not store completed work, hypotheses, research notes, or historical narrative here.",
  "Every work item must include why_now, write_scope, inputs, and done_when.",
  "Use docs/roadmap/ROADMAP.md for broader prioritization, docs/adr/ for durable decisions, docs/standards/ for durable rules, and docs/reference/ for stable background.",
  "Use commits and pull requests as progress evidence.",
  "Do not create parallel TODO, plan, memory, or research-dump files."
]

[current]
summary = "Docs/tracking cleanup has been applied in the working tree. The next active slice should be selected from the living roadmap before further implementation."
exit_criteria = [
  "One release-readiness roadmap item is selected as the active implementation slice.",
  "TRACK.toml is updated with that slice's write scope, inputs, and verification gates.",
  "Any ambiguous release or distribution decision is captured in an ADR before implementation."
]
refs = [
  "docs/README.md",
  "docs/roadmap/ROADMAP.md",
  "docs/standards/DOCS-STRUCTURE-STANDARD.md",
  "docs/standards/TRACK-STRUCTURE-STANDARD.md"
]

[[work_items]]
id = "select-release-readiness-slice"
status = "ready"
title = "Choose the next release-readiness slice"
why_now = "The initial implementation baseline and docs/tracking reset are complete enough that further work needs an explicit next release-readiness objective."
write_scope = [
  "TRACK.toml",
  "docs/roadmap/ROADMAP.md",
  "docs/adr/",
  "README.md",
  "pi-plugin/config-schema.toml",
  "cli/"
]
inputs = [
  "docs/roadmap/ROADMAP.md#next",
  "docs/standards/DOCS-STRUCTURE-STANDARD.md",
  "docs/standards/IMPLEMENTATION-RUN-PROTOCOL.md"
]
done_when = [
  "Exactly one next release-readiness slice is chosen.",
  "TRACK.toml is updated to make that slice active with valid bounded active-window fields.",
  "Required decision docs or verification commands for the selected slice are identified."
]
