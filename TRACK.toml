  "Use docs/roadmap/ROADMAP.md for the full verified product checklist, docs/adr/ for durable decisions, docs/standards/ for durable rules, and docs/reference/ for reference context.",
  "Use commits and pull requests as progress evidence.",
  "Do not create parallel TODO, plan, memory, or research-dump files."
]

