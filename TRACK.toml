version = 2
updated = "2026-05-08"
phase = "release-artifact-smoke-complete"
goal = "Keep the GitHub Release archive baseline verified while choosing any later release automation deliberately."
next_focus = "Wait for the next explicit release or implementation slice; do not add Homebrew, npm, GoReleaser, or broad release automation without a new bounded decision."

[tracking]
schema = "active-window-v1"
canonical_current_state = "TRACK.toml"
canonical_roadmap = "docs/roadmap/ROADMAP.md"
canonical_reference = "docs/reference/"
canonical_decision_history = "docs/adr/"
canonical_standards = "docs/standards/"
progress_evidence = "git commits and pull requests"
rules = [
  "Keep only active-window state here.",
  "Do not store completed work, hypotheses, research notes, or historical narrative here.",
  "Every work item must include why_now, write_scope, inputs, and done_when.",
  "Use docs/roadmap/ROADMAP.md for broader prioritization, docs/adr/ for durable decisions, docs/standards/ for durable rules, and docs/reference/ for stable background.",
  "Use commits and pull requests as progress evidence.",
  "Do not create parallel TODO, plan, memory, or research-dump files."
]

[current]
summary = "GitHub Release archive packaging is in place: README-named Linux, macOS, and Windows archives are generated by `cli/package_release.sh`, and tar/zip layout is smoke-checked in CI and acceptance."
exit_criteria = [
  "No active release-artifact implementation slice is open.",
  "Future package-manager or broad release-automation work starts with a new TRACK slice and ADR if it changes distribution policy."
]
refs = [
  "README.md",
  "docs/roadmap/ROADMAP.md",
  ".github/workflows/ci.yml",
  "cli/acceptance.sh",
  "cli/package_release.sh",
  "docs/adr/0013-use-github-releases-as-first-distribution-channel.md"
]

[[work_items]]
id = "await-next-release-slice"
status = "queued"
title = "Await next bounded release or implementation slice"
why_now = "The current release artifact slice is complete; further work should be driven by an explicit release, automation, or product objective."
write_scope = [
  "TRACK.toml",
  "docs/roadmap/ROADMAP.md",
  "docs/adr/",
  "README.md"
]
inputs = [
  "docs/roadmap/ROADMAP.md#later",
  "docs/adr/0013-use-github-releases-as-first-distribution-channel.md",
  "docs/standards/IMPLEMENTATION-RUN-PROTOCOL.md"
]
done_when = [
  "A new active slice is chosen only when there is an explicit next release, automation, or product objective."
]
