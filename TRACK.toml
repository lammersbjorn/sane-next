version = 1
updated = "2026-05-07"
phase = "research-active"
goal = "Build the smallest reliable Codex workflow tool that improves long-running coding outcomes without recreating Sane's bloat."
next_focus = "Finish the one-shot build protocol, repo rules, tool/MCP policy, release strategy, and companion CLI research before implementation starts."

[tracking]
canonical_current_state = "TRACK.toml"
canonical_decision_history = "docs/adr/"
external_mirror = "optional"
external_mirror_authority = "non-authoritative"

rules = [
  "Keep only active and near-term state here.",
  "Record decisions in ADRs, not in TRACK.toml notes.",
  "Use commits and pull requests as progress evidence.",
  "Do not create parallel TODO, plan, memory, or research-dump files.",
  "Read AGENTS.md and .github/copilot-instructions.md before broad work.",
  "Treat only current ADRs as authoritative; superseded files should not remain in the repo.",
  "Use committed git hooks and Conventional Commits for all new commits."
]

[[items]]
id = "tracking-system"
status = "done"
title = "Choose canonical tracking system"
notes = "Use TRACK.toml plus ADRs. External mirrors are optional and non-authoritative."
refs = [
  "docs/adr/0002-use-track-toml-plus-adrs-for-tracking.md",
]

[[items]]
id = "sane-postmortem"
status = "done"
title = "Extract lessons from current Sane"
notes = "Preserve outcome-first vision, minimal always-on guidance, verification discipline, skill-first extensibility, and explicit recovery. Discard TUI-heavy scope, doc sprawl, framework growth, and premature routing complexity."
refs = ["docs/adr/0004-use-pi-overlay-with-codex-skill-export.md"]

[[items]]
id = "architecture-direction"
status = "done"
title = "Choose initial product direction"
notes = "Use Pi as the primary runtime via an overlay/distribution model, keep packs skill-first, add a small companion CLI for install/export/update/doctor, and export the same packs to Codex-native skill paths."
refs = ["docs/adr/0004-use-pi-overlay-with-codex-skill-export.md"]

[[items]]
id = "implementation-run"
status = "next"
title = "Prepare the first implementation slice"
notes = "Define the first Pi overlay slice: core plugin manifest, companion CLI surface, shared skill pack export to Pi and Codex, and the first end-to-end acceptance path."
depends_on = ["tracking-system", "sane-postmortem", "architecture-direction"]

