name: ci

on:
  pull_request:
  push:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go unit tests
        working-directory: cli
        run: go test ./...
      - name: Pi plugin tests
        run: node --test pi-plugin/plugin.test.js

  acceptance:
    name: acceptance (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./cli/acceptance.sh

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build release target matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cd cli
          GOOS=linux GOARCH=amd64 go build -o ../dist/sane-next-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -o ../dist/sane-next-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -o ../dist/sane-next-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -o ../dist/sane-next-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -o ../dist/sane-next-windows-amd64.exe .
          GOOS=windows GOARCH=arm64 go build -o ../dist/sane-next-windows-arm64.exe .
