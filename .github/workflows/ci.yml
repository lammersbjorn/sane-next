name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".github/release-notes-*.txt"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".github/release-notes-*.txt"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Go unit tests
        working-directory: cli
        run: go test ./...
      - name: Pi plugin tests
        run: node --test pi-plugin/plugin.test.js

  acceptance:
    name: acceptance (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: cli/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: ./cli/acceptance.sh
