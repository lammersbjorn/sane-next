name: ci

on:
  pull_request:
  push:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Go unit tests
        working-directory: cli
        run: go test ./...
      - name: Pi plugin tests
        run: node --test pi-plugin/plugin.test.js

  acceptance:
    name: acceptance (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: ./cli/acceptance.sh

  cross-build:
    name: cross-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build release archives
        shell: bash
        run: ./cli/package_release.sh
      - name: Inspect release archives
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/sane-next_0.3.0-beta.1_darwin_arm64.tar.gz
          test -f dist/sane-next_0.3.0-beta.1_windows_amd64.zip
          mkdir -p dist/check
          tar -xzf dist/sane-next_0.3.0-beta.1_darwin_arm64.tar.gz -C dist/check
          test -f dist/check/sane-next_0.3.0-beta.1_darwin_arm64/sane-next
          test -f dist/check/sane-next_0.3.0-beta.1_darwin_arm64/README.md
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive = Path("dist/sane-next_0.3.0-beta.1_windows_amd64.zip")
          with zipfile.ZipFile(archive) as z:
              names = set(z.namelist())
          expected = {
              "sane-next_0.3.0-beta.1_windows_amd64/sane-next.exe",
              "sane-next_0.3.0-beta.1_windows_amd64/README.md",
          }
          missing = expected - names
          if missing:
              raise SystemExit(f"windows release archive missing: {sorted(missing)}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sane-next-release-archives
          path: dist/sane-next_*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: sane-next-release-zips
          path: dist/sane-next_*.zip
